career-profile:
    title: Career Profile
    summary: |
      Senior Test Manager who builds the tooling he advocates. I lead
      end-to-end test delivery for complex programs in financial services
      and government — strategy, risk-based planning, team leadership, and
      release assurance — and I write production software myself: Laravel
      applications, Python automation, and an AI QA-agent framework that
      runs fully air-gapped.

      Teams work with me because I can talk architecture with developers,
      risk with executives, and get hands-on with the tools we evaluate.
      My philosophy is simple: show it running rather than presenting
      slides.

