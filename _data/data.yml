career-profile:
    title: Career Profile
    summary: |
      Senior Test Manager with 15+ years in software quality assurance,
      leading end-to-end test delivery across complex programs in financial
      services, utilities, and government. I run multi-stream test programs,
      lead onshore and offshore teams to coordinated delivery, and lift the
      quality practice around me — regression frameworks, tooling adoption,
      and defect governance across stakeholders and vendors.

      What sets me apart is that I also build the tooling I advocate: Laravel
      and Python applications, and QA agent frameworks on LLMs that I design
      and operate myself. I can talk architecture with developers, risk with
      executives, and show a working artefact instead of a slide. Teams grow
      with me — I have mentored testers, run hiring and onboarding, and built
      capability rather than just consumed it.

experiences:
    title: Experiences
    info:
      - role: Test Manager (Test Consultant)
        time: 2016 - Present
        company: Planit, Sydney
        details: |
          Ten years at a global quality engineering firm, progressing from
          Test Engineer through Test Lead and Account Manager to Test
          Manager delivering client programs across financial services,
          utilities, and government.
            - SA Water (2025–current), Test Manager — led testing across a multi-project program, aligning delivery across streams; oversaw SIT across multiple systems and integrations; uplifted business-user capability in Azure DevOps, improving UAT performance
            - Non-bank finance provider (2024), Test Manager — end-to-end testing of a payment module within an asset-finance platform; managed offshore teams across multiple regions; delivered SIT and performance testing to release timelines; implemented a regression framework for ongoing platform stability; drove Zephyr Scale adoption; chaired defect triage across stakeholders and vendors
            - Transport energy distributor (2023), Test Manager — SIT and performance testing for a fleet-card banking system implementation; coordinated testing across stakeholders and vendors; supported go-live as production release coordinator
            - Sydney Water, program delivery — led testing across a multi-project program with a distributed team of up to 7 testers (onshore/offshore); oversaw SIT across multiple systems and integrations; collaborated with automation and performance teams
            - Side-by-side with client delivery, built qa-copilot: a portable QA agent framework (Python) for LLM-assisted test-case generation, defect triage, and automation orchestration — designed for cloud, on-prem, and air-gapped client environments

      - role: Senior Test Analyst / Test Lead
        time: 2011 - 2016
        company: Harvey Norman, Homebush NSW
        details: |
          Test Lead for Harvey Norman's in-house Point of Sale platform,
          supporting deployments across Australian and international stores.
            - Led SIT testing across concurrent initiatives on business-critical retail systems
            - Managed end-to-end regression cycles; designed tests across complex integrations — EFTPOS, credit and interest-free payment solutions, and EDIFACT supply-chain processes
            - Built the "Play Pen" store-simulation environment so business users could validate promotions and system changes before release
            - Championed Confluence for test documentation; introduced structured test-completion reporting for stakeholder transparency
            - Developed VBScript automation for SIT environment maintenance, data refresh, and deployment
            - Mentored junior testers and contributed to hiring and onboarding of new testing resources

      - role: Retail & Commercial Operations (early career)
        time: 2001 - 2011
        company: Samsung Electronics AU · Paxtons · Camera Sales · Wonderland Sydney
        details: |
          Eleven years in commercial operations before moving into software
          testing — product marketing support at Samsung head office, store
          and team management in retail. A business user's empathy most test
          leaders have to learn the hard way.

